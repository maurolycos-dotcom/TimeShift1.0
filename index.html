<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flight Time</title>

    <style>

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
        }

        .app {
            padding: 40px 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 40px;
        }


        /* =====================================
           ANALOGUHR
           ===================================== */

        .clock {
            width: 280px;
            height: 280px;

            border: 5px solid white;
            border-radius: 50%;

            margin: 0 auto 40px;

            position: relative;
        }


        /* Mittelpunkt */

        .center {
            width: 14px;
            height: 14px;

            background: white;

            border-radius: 50%;

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            z-index: 10;
        }


        /* Zeiger */

        .hand {
            position: absolute;

            left: 50%;
            bottom: 50%;

            transform-origin: bottom center;

            border-radius: 5px;
        }


        .hour-hand {
            width: 7px;
            height: 70px;

            background: white;
        }


        .minute-hand {
            width: 5px;
            height: 100px;

            background: white;
        }


        .second-hand {
            width: 2px;
            height: 115px;

            background: red;
        }


        /* =====================================
           UHRENZIFFERN
           ===================================== */

        .number {
            position: absolute;

            font-size: 22px;
            font-weight: 500;

            transform: translate(-50%, -50%);
        }

        .n12 {
            left: 50%;
            top: 9%;
        }

        .n3 {
            left: 91%;
            top: 50%;
        }

        .n6 {
            left: 50%;
            top: 91%;
        }

        .n9 {
            left: 9%;
            top: 50%;
        }


        /* =====================================
           INFORMATION
           ===================================== */

        .info {
            font-size: 18px;
            line-height: 2;

            color: #aaa;
        }


        /* =====================================
           BUTTON
           ===================================== */

        button {
            margin-top: 30px;

            padding: 16px 30px;

            font-size: 20px;

            border: 0;
            border-radius: 14px;

            background: white;
            color: black;
        }

        button:disabled {
            opacity: 0.5;
        }

    </style>
</head>


<body>

<div class="app">

    <h1>✈️ München → Singapur</h1>


    <!-- =====================================
         ANALOGUHR
         ===================================== -->

    <div class="clock">

        <div class="number n12">12</div>
        <div class="number n3">3</div>
        <div class="number n6">6</div>
        <div class="number n9">9</div>


        <div
            id="hourHand"
            class="hand hour-hand">
        </div>

        <div
            id="minuteHand"
            class="hand minute-hand">
        </div>

        <div
            id="secondHand"
            class="hand second-hand">
        </div>

        <div class="center"></div>

    </div>


    <!-- =====================================
         INFORMATION
         ===================================== -->

    <div class="info">

        <div>
            Vergangene Flugzeit:
            <span id="elapsed">00:00</span>
        </div>

        <div>
            Verbleibende Flugzeit:
            <span id="remaining">12:00</span>
        </div>

    </div>


    <button id="startButton">
        Flug starten
    </button>

</div>


<script>


// ==========================================
// FLUGDATEN
// ==========================================

const abflugStunde = 12;
const abflugMinute = 0;

const gesamtFlugzeit = 12 * 60;

const zeitverschiebung = 6 * 60;


// ==========================================
// VARIABLEN
// ==========================================

let startzeit = null;

let timer = null;


// ==========================================
// START
// ==========================================

document
    .getElementById("startButton")
    .addEventListener("click", function () {

        startzeit = Date.now();


        // Button ändern

        const button =
            document.getElementById("startButton");

        button.textContent = "Flug läuft …";

        button.disabled = true;


        // Timer starten

        if (timer !== null) {
            clearInterval(timer);
        }

        timer = setInterval(berechnen, 100);


        berechnen();

    });


// ==========================================
// BERECHNUNG
// ==========================================

function berechnen() {

    if (startzeit === null) {
        return;
    }


    // Tatsächlich vergangene Minuten

    let vergangen =
        (Date.now() - startzeit) / 60000;


    // Flugende

    if (vergangen > gesamtFlugzeit) {

        vergangen = gesamtFlugzeit;

        clearInterval(timer);

    }


    // ======================================
    // UNSERE FORMEL
    // ======================================

    let theoretischeZeit =

        (abflugStunde * 60)

        + abflugMinute

        + vergangen

        + vergangen *
        (zeitverschiebung / gesamtFlugzeit);


    // ======================================
    // 24-STUNDEN-MODELL
    // ======================================

    theoretischeZeit =
        theoretischeZeit % (24 * 60);


    // ======================================
    // ANALOGUHR
    // ======================================

    const stunden =
        theoretischeZeit / 60;

    const minuten =
        theoretischeZeit % 60;


    // Stundenzeiger

    const stundenWinkel =
        (stunden % 12) * 30;

    document
        .getElementById("hourHand")
        .style.transform =
        `translateX(-50%) rotate(${stundenWinkel}deg)`;


    // Minutenzeiger

    const minutenWinkel =
        minuten * 6;

    document
        .getElementById("minuteHand")
        .style.transform =
        `translateX(-50%) rotate(${minutenWinkel}deg)`;


    // Sekundenzeiger

    const sekunden =
        (theoretischeZeit * 60) % 60;

    const sekundenWinkel =
        sekunden * 6;

    document
        .getElementById("secondHand")
        .style.transform =
        `translateX(-50%) rotate(${sekundenWinkel}deg)`;


    // ======================================
    // INFORMATION
    // ======================================

    document
        .getElementById("elapsed")
        .textContent =
        dauerFormatieren(vergangen);


    const verbleibend =
        gesamtFlugzeit - vergangen;


    document
        .getElementById("remaining")
        .textContent =
        dauerFormatieren(verbleibend);

}


// ==========================================
// ZEIT FORMATIEREN
// ==========================================

function zweiStellen(zahl) {

    return String(zahl)
        .padStart(2, "0");

}


function dauerFormatieren(minuten) {

    const stunden =
        Math.floor(minuten / 60);

    const rest =
        Math.floor(minuten % 60);

    return (
        zweiStellen(stunden)
        + ":"
        + zweiStellen(rest)
    );

}

</script>

</body>
</html>
