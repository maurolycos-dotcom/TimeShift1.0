<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TimeShift</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
    text-align: center;
}

.app {
    padding: 25px 12px 40px;
}


/* =====================================================
   KOPFZEILE
   ===================================================== */

.app-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
}

.app-header h1 {
    font-size: 28px;
    margin: 0;
}


/* =====================================================
   UHR-AUSWAHL
   ===================================================== */

.clock-selector {
    position: relative;
}

#clockSelectorButton {
    margin: 0;
    padding: 7px 10px;
    font-size: 12px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    cursor: pointer;
}

.clock-selector-menu {
    display: none;
    position: absolute;
    top: calc(100% + 5px);
    right: 0;
    min-width: 135px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
    z-index: 100;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
}

.clock-selector-menu.open {
    display: block;
}

.clock-option {
    padding: 11px 14px;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
}

.clock-option:active {
    background: #444;
}


/* =====================================================
   START / ZIEL
   ===================================================== */

.selection {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 25px;
}

.selection-group {
    width: 180px;
    position: relative;
}

.selection label {
    display: block;
    color: #aaa;
    font-size: 14px;
    margin-bottom: 7px;
}

.search-input {
    width: 100%;
    padding: 12px;
    font-size: 17px;
    border: none;
    border-radius: 12px;
    background: #222;
    color: white;
    outline: none;
    text-align: center;
}

.search-input:focus {
    background: #292929;
}

.search-input::placeholder {
    color: #777;
}

.arrow {
    font-size: 25px;
    margin-top: 32px;
}


/* =====================================================
   SUCHERGEBNISSE
   ===================================================== */

.results {
    position: absolute;
    top: 66px;
    left: 0;
    width: 100%;
    max-height: 330px;
    overflow-y: auto;
    background: #222;
    border-radius: 12px;
    z-index: 50;
    display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.result {
    min-height: 45px;
    padding: 5px 6px;
    border-bottom: 1px solid #333;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 5px;
}

.result:last-child {
    border-bottom: none;
}

.city-name {
    flex: 1;
    cursor: pointer;
    text-align: left;
    padding-left: 5px;
}

.favorite-button,
.delete-favorite-button {
    width: 36px;
    height: 36px;
    margin: 0;
    padding: 0;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: white;
    cursor: pointer;
}

.favorite-button {
    font-size: 22px;
}

.delete-favorite-button {
    font-size: 17px;
}

.favorite-button:active,
.delete-favorite-button:active {
    background: #444;
}

.favorite-title {
    padding: 10px 8px 7px;
    color: #aaa;
    font-size: 12px;
    text-align: left;
    border-bottom: 1px solid #333;
}


/* =====================================================
   FLUGZEIT
   ===================================================== */

.flight-duration {
    margin-bottom: 25px;
}

.flight-duration label {
    display: block;
    color: #aaa;
    font-size: 14px;
    margin-bottom: 8px;
}

.duration-inputs {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
}

.duration-inputs select {
    width: 85px;
    padding: 11px;
    font-size: 17px;
    border: none;
    border-radius: 12px;
    background: #222;
    color: white;
    text-align: center;
}

.duration-unit {
    color: #aaa;
    font-size: 15px;
}


/* =====================================================
   UHREN
   ===================================================== */

.clocks-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
}


/* =====================================================
   LOKALE UHREN
   ===================================================== */

.local-clock {
    width: 85px;
}

.local-time {
    font-family: "Courier New", monospace;
    font-size: 19px;
    font-weight: 600;
    white-space: nowrap;
}

.local-city {
    margin-top: 8px;
    font-size: 13px;
    color: #aaa;
}


/* =====================================================
   ANALOGUHR
   ===================================================== */

.clock {
    width: 270px;
    height: 270px;
    border: 5px solid white;
    border-radius: 50%;
    position: relative;
    flex-shrink: 0;
}


/* =====================================================
   ZIFFERN 1 - 12
   ===================================================== */

.number {
    position: absolute;
    width: 30px;
    height: 30px;
    line-height: 30px;
    font-size: 21px;
    transform: translate(-50%, -50%);
}

.n12 {
    left: 50%;
    top: 8%;
}

.n1 {
    left: 71%;
    top: 13%;
}

.n2 {
    left: 87%;
    top: 29%;
}

.n3 {
    left: 92%;
    top: 50%;
}

.n4 {
    left: 87%;
    top: 71%;
}

.n5 {
    left: 71%;
    top: 87%;
}

.n6 {
    left: 50%;
    top: 92%;
}

.n7 {
    left: 29%;
    top: 87%;
}

.n8 {
    left: 13%;
    top: 71%;
}

.n9 {
    left: 8%;
    top: 50%;
}

.n10 {
    left: 13%;
    top: 29%;
}

.n11 {
    left: 29%;
    top: 13%;
}


/* =====================================================
   ZEIGER
   ===================================================== */

.center {
    width: 14px;
    height: 14px;
    background: white;
    border-radius: 50%;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
}

.hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    transform-origin: bottom center;
    border-radius: 5px;
}

.hour-hand {
    width: 7px;
    height: 70px;
    background: white;
}

.minute-hand {
    width: 5px;
    height: 100px;
    background: white;
}

.second-hand {
    width: 2px;
    height: 115px;
    background: red;
}


/* =====================================================
   FLUGFORTSCHRITT
   ===================================================== */

.flight-status {
    width: 100%;
    max-width: 420px;
    margin: 32px auto 0;
    padding: 18px 15px 16px;
    background: #1d1d1d;
    border-radius: 16px;
    border: 1px solid #333;
}

.flight-status-title {
    color: #aaa;
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 16px;
}

.flight-times {
    display: flex;
    justify-content: center;
    align-items: center;
}

.flight-time-block {
    flex: 1;
}

.flight-time-label {
    display: block;
    color: #888;
    font-size: 13px;
    margin-bottom: 6px;
}

.flight-time-value {
    display: block;
    font-family: "Courier New", monospace;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 1px;
}

.flight-time-divider {
    width: 1px;
    height: 42px;
    background: #444;
    margin: 0 15px;
}


/* =====================================================
   ANKUNFT
   ===================================================== */

.arrival {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid #333;
}

.arrival-title {
    color: #aaa;
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.arrival-city {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
}

.arrival-date {
    font-size: 15px;
    color: #ccc;
    line-height: 1.5;
}

.arrival-time {
    font-family: "Courier New", monospace;
    font-size: 24px;
    font-weight: 600;
    margin-top: 3px;
}


/* =====================================================
   FEHLER
   ===================================================== */

#errorMessage {
    min-height: 22px;
    margin-top: 12px;
    color: #ff6b6b;
    font-size: 14px;
}


/* =====================================================
   BUTTONS
   ===================================================== */

button {
    margin-top: 25px;
    padding: 16px 30px;
    font-size: 19px;
    border: none;
    border-radius: 14px;
    background: white;
    color: black;
}

button:disabled {
    opacity: 0.5;
}

#cancelButton {
    display: none;
    margin-left: 8px;
    background: #333;
    color: white;
}


/* =====================================================
   SICHERHEITSABFRAGE
   ===================================================== */

.dialog-background {
    display: none;
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.75);
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.dialog {
    width: 80%;
    max-width: 350px;
    background: #222;
    border-radius: 20px;
    padding: 25px;
}

.dialog h2 {
    margin-top: 0;
}

.dialog p {
    color: #aaa;
    line-height: 1.5;
}

.dialog button {
    width: 100%;
    margin-left: 0;
}

.confirm-cancel {
    background: #444;
    color: white;
}

.confirm-stop {
    background: #c00;
    color: white;
}


/* =====================================================
   HANDY
   ===================================================== */

@media (max-width: 600px) {

    .selection {
        gap: 6px;
    }

    .selection-group {
        width: 150px;
    }

    .search-input {
        font-size: 15px;
    }

    .clock {
        width: 220px;
        height: 220px;
    }

    .local-clock {
        width: 65px;
    }

    .local-time {
        font-size: 14px;
    }

    .local-city {
        font-size: 11px;
    }

    .number {
        font-size: 17px;
    }

    .flight-time-value {
        font-size: 24px;
    }

    .flight-time-divider {
        margin: 0 8px;
    }

    .arrival-date {
        font-size: 14px;
    }

    .app-header {
        gap: 8px;
    }

    .app-header h1 {
        font-size: 26px;
    }

}

</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     KOPF
     ===================================================== -->

<div class="app-header">

    <h1>
        ✈️ TimeShift
    </h1>

    <div class="clock-selector">

        <button
            id="clockSelectorButton"
            type="button"
            aria-label="Uhrdarstellung">
            🕐 ▾
        </button>

        <div
            id="clockSelectorMenu"
            class="clock-selector-menu">

            <div
                class="clock-option"
                data-value="withoutSeconds">
                Ohne Sekunden
            </div>

            <div
                class="clock-option"
                data-value="withSeconds">
                Mit Sekunden
            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     START / ZIEL
     ===================================================== -->

<div class="selection">

    <div class="selection-group">

        <label>
            Abflugort
        </label>

        <input
            id="startSearch"
            class="search-input"
            type="text"
            placeholder="Ort suchen"
            autocomplete="off">

        <div
            id="startResults"
            class="results">
        </div>

    </div>


    <div class="arrow">
        →
    </div>


    <div class="selection-group">

        <label>
            Zielort
        </label>

        <input
            id="destinationSearch"
            class="search-input"
            type="text"
            placeholder="Ort suchen"
            autocomplete="off">

        <div
            id="destinationResults"
            class="results">
        </div>

    </div>

</div>


<!-- =====================================================
     FLUGZEIT
     ===================================================== -->

<div class="flight-duration">

    <label>
        Flugzeit
    </label>

    <div class="duration-inputs">

        <select id="flightHours">

            <option value="">
                --
            </option>

        </select>

        <span class="duration-unit">
            Stunden
        </span>


        <select id="flightMinutes">

            <option value="">
                --
            </option>

        </select>

        <span class="duration-unit">
            Minuten
        </span>

    </div>

</div>


<!-- =====================================================
     UHREN
     ===================================================== -->

<div class="clocks-area">


    <!-- STARTORT -->

    <div class="local-clock">

        <div
            id="startTime"
            class="local-time">

            --:--

        </div>

        <div
            id="startCity"
            class="local-city">

            —

        </div>

    </div>


    <!-- ANALOGUHR -->

    <div class="clock">

        <div class="number n1">1</div>
        <div class="number n2">2</div>
        <div class="number n3">3</div>
        <div class="number n4">4</div>
        <div class="number n5">5</div>
        <div class="number n6">6</div>
        <div class="number n7">7</div>
        <div class="number n8">8</div>
        <div class="number n9">9</div>
        <div class="number n10">10</div>
        <div class="number n11">11</div>
        <div class="number n12">12</div>

        <div
            id="hourHand"
            class="hand hour-hand">
        </div>

        <div
            id="minuteHand"
            class="hand minute-hand">
        </div>

        <div
            id="secondHand"
            class="hand second-hand"
            style="display:none;">
        </div>

        <div class="center">
        </div>

    </div>


    <!-- ZIELORT -->

    <div class="local-clock">

        <div
            id="destinationTime"
            class="local-time">

            --:--

        </div>

        <div
            id="destinationCity"
            class="local-city">

            —

        </div>

    </div>

</div>


<!-- =====================================================
     FLUGFORTSCHRITT
     ===================================================== -->

<div class="flight-status">

    <div class="flight-status-title">
        FLUGFORTSCHRITT
    </div>

    <div class="flight-times">

        <div class="flight-time-block">

            <span class="flight-time-label">
                Vergangen
            </span>

            <span
                id="elapsed"
                class="flight-time-value">
                00:00
            </span>

        </div>


        <div class="flight-time-divider">
        </div>


        <div class="flight-time-block">

            <span class="flight-time-label">
                Verbleibend
            </span>

            <span
                id="remaining"
                class="flight-time-value">
                --:--
            </span>

        </div>

    </div>


    <!-- =================================================
         ANKUNFT
         ================================================= -->

    <div class="arrival">

        <div class="arrival-title">
            ANKUNFT
        </div>

        <div
            id="arrivalCity"
            class="arrival-city">
            —
        </div>

        <div
            id="arrivalDate"
            class="arrival-date">
            —
        </div>

        <div
            id="arrivalTime"
            class="arrival-time">
            --:--
        </div>

    </div>

</div>


<div id="errorMessage">
</div>


<button id="startButton">
    Flug starten
</button>


<button id="cancelButton">
    Flug abbrechen
</button>


</div>


<!-- =====================================================
     SICHERHEITSABFRAGE
     ===================================================== -->

<div
    id="dialogBackground"
    class="dialog-background">

    <div class="dialog">

        <h2>
            Flug abbrechen?
        </h2>

        <p>
            Möchtest du den aktuellen Flug
            wirklich abbrechen?
        </p>

        <p>
            Der bisherige Flugfortschritt
            geht verloren.
        </p>

        <button
            id="dialogCancel"
            class="confirm-cancel">
            Weiterfliegen
        </button>

        <button
            id="dialogConfirm"
            class="confirm-stop">
            Flug abbrechen
        </button>

    </div>

</div>


<script>


// =====================================================
// STÄDTE
// =====================================================

const staedte = [

    { name: "Amsterdam", timezone: "Europe/Amsterdam" },
    { name: "Athen", timezone: "Europe/Athens" },
    { name: "Atlanta", timezone: "America/New_York" },
    { name: "Bangkok", timezone: "Asia/Bangkok" },
    { name: "Barcelona", timezone: "Europe/Madrid" },
    { name: "Beijing", timezone: "Asia/Shanghai" },
    { name: "Berlin", timezone: "Europe/Berlin" },
    { name: "Boston", timezone: "America/New_York" },
    { name: "Brüssel", timezone: "Europe/Brussels" },
    { name: "Budapest", timezone: "Europe/Budapest" },
    { name: "Buenos Aires", timezone: "America/Argentina/Buenos_Aires" },
    { name: "Chicago", timezone: "America/Chicago" },
    { name: "Dallas", timezone: "America/Chicago" },
    { name: "Delhi", timezone: "Asia/Kolkata" },
    { name: "Denver", timezone: "America/Denver" },
    { name: "Dubai", timezone: "Asia/Dubai" },
    { name: "Dublin", timezone: "Europe/Dublin" },
    { name: "Edinburgh", timezone: "Europe/London" },
    { name: "Frankfurt", timezone: "Europe/Berlin" },
    { name: "Genf", timezone: "Europe/Zurich" },
    { name: "Helsinki", timezone: "Europe/Helsinki" },
    { name: "Hongkong", timezone: "Asia/Hong_Kong" },
    { name: "Istanbul", timezone: "Europe/Istanbul" },
    { name: "Jakarta", timezone: "Asia/Jakarta" },
    { name: "Johannesburg", timezone: "Africa/Johannesburg" },
    { name: "Kairo", timezone: "Africa/Cairo" },
    { name: "Kapstadt", timezone: "Africa/Johannesburg" },
    { name: "Kopenhagen", timezone: "Europe/Copenhagen" },
    { name: "Kuala Lumpur", timezone: "Asia/Kuala_Lumpur" },
    { name: "Lissabon", timezone: "Europe/Lisbon" },
    { name: "London", timezone: "Europe/London" },
    { name: "Los Angeles", timezone: "America/Los_Angeles" },
    { name: "Madrid", timezone: "Europe/Madrid" },
    { name: "Mailand", timezone: "Europe/Rome" },
    { name: "Manila", timezone: "Asia/Manila" },
    { name: "Melbourne", timezone: "Australia/Melbourne" },
    { name: "Mexiko-Stadt", timezone: "America/Mexico_City" },
    { name: "Miami", timezone: "America/New_York" },
    { name: "Montreal", timezone: "America/Toronto" },
    { name: "Moskau", timezone: "Europe/Moscow" },
    { name: "München", timezone: "Europe/Berlin" },
    { name: "New York", timezone: "America/New_York" },
    { name: "Osaka", timezone: "Asia/Tokyo" },
    { name: "Oslo", timezone: "Europe/Oslo" },
    { name: "Paris", timezone: "Europe/Paris" },
    { name: "Perth", timezone: "Australia/Perth" },
    { name: "Prag", timezone: "Europe/Prague" },
    { name: "Reykjavík", timezone: "Atlantic/Reykjavik" },
    { name: "Rom", timezone: "Europe/Rome" },
    { name: "San Francisco", timezone: "America/Los_Angeles" },
    { name: "São Paulo", timezone: "America/Sao_Paulo" },
    { name: "Seoul", timezone: "Asia/Seoul" },
    { name: "Shanghai", timezone: "Asia/Shanghai" },
    { name: "Singapur", timezone: "Asia/Singapore" },
    { name: "Stockholm", timezone: "Europe/Stockholm" },
    { name: "Sydney", timezone: "Australia/Sydney" },
    { name: "Taipeh", timezone: "Asia/Taipei" },
    { name: "Tokio", timezone: "Asia/Tokyo" },
    { name: "Toronto", timezone: "America/Toronto" },
    { name: "Vancouver", timezone: "America/Vancouver" },
    { name: "Venedig", timezone: "Europe/Rome" },
    { name: "Warschau", timezone: "Europe/Warsaw" },
    { name: "Wien", timezone: "Europe/Vienna" },
    { name: "Zürich", timezone: "Europe/Zurich" }

];


staedte.sort(
    (a, b) =>
        a.name.localeCompare(b.name, "de")
);


// =====================================================
// FAVORITEN
// =====================================================

const FAVORITEN_KEY =
    "timeShiftFavoriten";


function favoritenLaden() {

    try {

        const gespeichert =
            localStorage.getItem(
                FAVORITEN_KEY
            );

        if (!gespeichert) {
            return [];
        }

        const daten =
            JSON.parse(gespeichert);

        return Array.isArray(daten)
            ? daten
            : [];

    } catch (e) {

        return [];

    }

}


function favoritenSpeichern(liste) {

    try {

        localStorage.setItem(
            FAVORITEN_KEY,
            JSON.stringify(liste)
        );

    } catch (e) {}

}


let favoriten =
    favoritenLaden();


function istFavorit(stadt) {

    return favoriten.includes(
        stadt.name
    );

}


function favoritHinzufuegen(stadt) {

    if (!istFavorit(stadt)) {

        favoriten.push(
            stadt.name
        );

        favoritenSpeichern(
            favoriten
        );

    }

}


function favoritLoeschen(stadt) {

    favoriten =
        favoriten.filter(
            name =>
                name !== stadt.name
        );

    favoritenSpeichern(
        favoriten
    );

}


// =====================================================
// VARIABLEN
// =====================================================

let startzeit = null;
let startZeitzone = null;
let zielZeitzone = null;

let startStadt = null;
let zielStadt = null;

let startOrtszeit = null;
let zeitverschiebung = null;
let gesamtFlugzeit = null;

let timer = null;


// =====================================================
// ELEMENTE
// =====================================================

const startSearch =
    document.getElementById(
        "startSearch"
    );

const destinationSearch =
    document.getElementById(
        "destinationSearch"
    );

const startResults =
    document.getElementById(
        "startResults"
    );

const destinationResults =
    document.getElementById(
        "destinationResults"
    );

const flightHours =
    document.getElementById(
        "flightHours"
    );

const flightMinutes =
    document.getElementById(
        "flightMinutes"
    );

const secondHand =
    document.getElementById(
        "secondHand"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const cancelButton =
    document.getElementById(
        "cancelButton"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );

const dialogBackground =
    document.getElementById(
        "dialogBackground"
    );

const dialogCancel =
    document.getElementById(
        "dialogCancel"
    );

const dialogConfirm =
    document.getElementById(

// =====================================================
// UHR-AUSWAHL
// =====================================================

const clockSelectorButton =
    document.getElementById(
        "clockSelectorButton"
    );

const clockSelectorMenu =
    document.getElementById(
        "clockSelectorMenu"
    );

const clockOptions =
    document.querySelectorAll(
        ".clock-option"
    );


clockSelectorButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        clockSelectorMenu.classList.toggle(
            "open"
        );

    }
);


clockOptions.forEach(option => {

    option.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            const value =
                option.dataset.value;


            if (
                value ===
                "withSeconds"
            ) {

                secondHand.style.display =
                    "block";

            } else {

                secondHand.style.display =
                    "none";

            }


            clockSelectorButton.textContent =
                "🕐 ▾";


            clockSelectorMenu.classList.remove(
                "open"
            );

        }
    );

});


document.addEventListener(
    "click",
    function() {

        clockSelectorMenu.classList.remove(
            "open"
        );

    }
);


// =====================================================
// FLUGZEIT AUSWAHL
// =====================================================

for (let i = 0; i <= 30; i++) {

    const option =
        document.createElement(
            "option"
        );

    option.value = i;

    option.textContent =
        String(i).padStart(
            2,
            "0"
        );

    flightHours.appendChild(
        option
    );

}


for (let i = 0; i < 60; i++) {

    const option =
        document.createElement(
            "option"
        );

    option.value = i;

    option.textContent =
        String(i).padStart(
            2,
            "0"
        );

    flightMinutes.appendChild(
        option
    );

}


// =====================================================
// SUCHE
// =====================================================

function suche(eingabe) {

    const text =
        eingabe
            .trim()
            .toLocaleLowerCase(
                "de"
            );


    if (text === "") {

        return staedte.slice();

    }


    return staedte.filter(
        stadt =>
            stadt.name
                .toLocaleLowerCase(
                    "de"
                )
                .includes(text)
    );

}


// =====================================================
// ERGEBNISSE
// =====================================================

function ergebnisseAnzeigen(
    input,
    container,
    ziel
) {

    const treffer =
        suche(input.value);

    container.innerHTML = "";


    const favs =
        treffer.filter(
            stadt =>
                istFavorit(stadt)
        );


    const normale =
        treffer.filter(
            stadt =>
                !istFavorit(stadt)
        );


    if (favs.length > 0) {

        const titel =
            document.createElement(
                "div"
            );

        titel.className =
            "favorite-title";

        titel.textContent =
            "⭐ FAVORITEN";

        container.appendChild(
            titel
        );

    }


    favs.forEach(stadt => {

        container.appendChild(
            erstelleErgebnis(
                stadt,
                ziel,
                true,
                input,
                container
            )
        );

    });


    normale
        .slice(0, 8)
        .forEach(stadt => {

            container.appendChild(
                erstelleErgebnis(
                    stadt,
                    ziel,
                    false,
                    input,
                    container
                )
            );

        });


    if (
        container.children.length === 0
    ) {

        container.style.display =
            "none";

        return;

    }


    container.style.display =
        "block";

}


// =====================================================
// ERGEBNIS ELEMENT
// =====================================================

function erstelleErgebnis(
    stadt,
    ziel,
    favorit,
    input,
    container
) {

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "result";


    const cityName =
        document.createElement(
            "div"
        );

    cityName.className =
        "city-name";

    cityName.textContent =
        stadt.name;


    cityName.addEventListener(
        "click",
        function() {

            input.value =
                stadt.name;

            container.style.display =
                "none";


            if (ziel === "start") {

                startStadt =
                    stadt.name;

                startZeitzone =
                    stadt.timezone;


                document
                    .getElementById(
                        "startCity"
                    )
                    .textContent =
                    startStadt;

            } else {

                zielStadt =
                    stadt.name;

                zielZeitzone =
                    stadt.timezone;


                document
                    .getElementById(
                        "destinationCity"
                    )
                    .textContent =
                    zielStadt;

            }

        }
    );


    element.appendChild(
        cityName
    );


    if (favorit) {

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "delete-favorite-button";

        button.textContent =
            "🗑️";

        button.title =
            "Favorit löschen";


        button.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                favoritLoeschen(
                    stadt
                );

                ergebnisseAnzeigen(
                    input,
                    container,
                    ziel
                );

            }
        );


        element.appendChild(
            button
        );

    } else {

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "favorite-button";

        button.textContent =
            "☆";

        button.title =
            "Zu Favoriten hinzufügen";


        button.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                favoritHinzufuegen(
                    stadt
                );

                ergebnisseAnzeigen(
                    input,
                    container,
                    ziel
                );

            }
        );


        element.appendChild(
            button
        );

    }


    return element;

}


// =====================================================
// SUCHFELDER
// =====================================================

            )

// =====================================================
// AUSSERHALB KLICKEN
// =====================================================

    function(event) {

            !startSearch.contains(
                event.target
            ) &&
            !startResults.contains(
                event.target
            )
        ) {

                "none";

        }


        if (
            !destinationSearch.contains(
                event.target
            ) &&
            !destinationResults.contains(
                event.target
            )
        ) {

            destinationResults.style.display =
                "none";

        }

    }
);


// =====================================================
// FLUGZEIT AUSLESEN
// =====================================================

function flugzeitAuslesen() {

    if (
        flightHours.value === "" ||
        flightMinutes.value === ""
    ) {

        return null;

    }


    const stunden =
        Number(
            flightHours.value
        );

    const minuten =
        Number(
            flightMinutes.value
        );


    const gesamt =
        stunden * 60 +
        minuten;


    if (gesamt <= 0) {

        return null;

    }


    return gesamt;

}


// =====================================================
// FLUG STARTEN
// =====================================================

startButton.addEventListener(
    "click",
    function() {

        errorMessage.textContent =
            "";


        if (
            !startStadt ||
            !startZeitzone
        ) {

            errorMessage.textContent =
                "Bitte einen Abflugort auswählen.";

            return;

        }


        if (
            !zielStadt ||
            !zielZeitzone
        ) {

            errorMessage.textContent =
                "Bitte einen Zielort auswählen.";

            return;

        }


        const flugzeit =
            flugzeitAuslesen();


        if (flugzeit === null) {

            errorMessage.textContent =
                "Bitte eine gültige Flugzeit eingeben.";

            return;

        }


        gesamtFlugzeit =
            flugzeit;


        startzeit =
            new Date();


        startOrtszeit =
            minutenSeitMitternacht(
                startzeit,
                startZeitzone
            );


        const startOffset =
            zeitzonenOffset(
                startzeit,
                startZeitzone
            );


        const zielOffset =
            zeitzonenOffset(
                startzeit,
                zielZeitzone
            );


        zeitverschiebung =
            (
                zielOffset -
                startOffset
            ) / 60000;


        startSearch.disabled =
            true;

        destinationSearch.disabled =
            true;

        flightHours.disabled =
            true;

        flightMinutes.disabled =
            true;


        startButton.textContent =
            "Flug läuft …";

        startButton.disabled =
            true;


        cancelButton.style.display =
            "inline-block";


        ankunftAnzeigen();


        if (timer !== null) {

            clearInterval(timer);

        }


        timer =
            setInterval(
                berechnen,
                100
            );


        berechnen();

    }
);


// =====================================================
// FLUG ABBRECHEN
// =====================================================

cancelButton.addEventListener(
    "click",
    function() {

        dialogBackground.style.display =
            "flex";

    }
);


dialogCancel.addEventListener(
    "click",
    function() {

        dialogBackground.style.display =
            "none";

    }
);


dialogConfirm.addEventListener(
    "click",

        dialogBackground.style.display =
            "none";

        flugZuruecksetzen();

    }
);


// =====================================================
// HAUPTBERECHNUNG
// =====================================================

function berechnen() {

    if (
        startzeit === null ||
        gesamtFlugzeit === null
    ) {

        return;

    }


    let vergangen =
        (
            Date.now() -
            startzeit.getTime()
        ) / 60000;


    if (
        vergangen >=
        gesamtFlugzeit
    ) {

        vergangen =
            gesamtFlugzeit;

        clearInterval(timer);

        timer = null;

    }


    /*
       THEORETISCHE TIME-SHIFT-ZEIT

       vergangene Flugzeit
       +
       anteiliger Anteil der
       gesamten Zeitverschiebung
    */

    let theoretischeZeit =

        startOrtszeit

        +

        vergangen

        +

        (
            vergangen *
            (
                zeitverschiebung /
                gesamtFlugzeit
            )
        );


    theoretischeZeit =
        normalisiereMinuten(
            theoretischeZeit
        );


    const stunden =
        theoretischeZeit / 60;

    const minuten =
        theoretischeZeit % 60;

    const sekunden =
        (
            theoretischeZeit * 60
        ) % 60;


    const stundenWinkel =
        (
            stunden % 12
        ) * 30;


    const minutenWinkel =
        minuten * 6;


    const sekundenWinkel =
        sekunden * 6;


    document
        .getElementById(
            "hourHand"
        )
        .style.transform =
        `translateX(-50%) rotate(${stundenWinkel}deg)`;


    document
        .getElementById(
            "minuteHand"
        )
        .style.transform =
        `translateX(-50%) rotate(${minutenWinkel}deg)`;


    document
        .getElementById(
            "secondHand"
        )
        .style.transform =
        `translateX(-50%) rotate(${sekundenWinkel}deg)`;


    aktualisiereOrtszeiten();


    document
        .getElementById(
            "elapsed"
        )
        .textContent =
        dauerFormatieren(
            vergangen
        );


    document
        .getElementById(
            "remaining"
        )
        .textContent =
        dauerFormatieren(
            Math.max(
                0,
                gesamtFlugzeit -
                vergangen
            )
        );

}


// =====================================================
// ANKUNFT
// =====================================================

function ankunftAnzeigen() {

    if (
        !startzeit ||
        !zielZeitzone ||
        !gesamtFlugzeit
    ) {

        return;

    }


    const ankunft =
        new Date(
            startzeit.getTime() +
            gesamtFlugzeit * 60000
        );


    const datumFormatter =
        new Intl.DateTimeFormat(
            "de-DE",
            {
                timeZone:
                    zielZeitzone,

                weekday:
                    "long",

                day:
                    "2-digit",

                month:
                    "long",

                year:
                    "numeric"
            }
        );


    const zeitFormatter =
        new Intl.DateTimeFormat(
            "de-DE",
            {
                timeZone:
                    zielZeitzone,

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                hourCycle:
                    "h23"
            }
        );


    document
        .getElementById(
            "arrivalCity"
        )
        .textContent =
        zielStadt;


    document
        .getElementById(
            "arrivalDate"
        )
        .textContent =
        datumFormatter.format(
            ankunft
        );


    document
        .getElementById(
            "arrivalTime"
        )
        .textContent =
        zeitFormatter.format(
            ankunft
        );

}


// =====================================================
// ORTSZEITEN
// =====================================================

function aktualisiereOrtszeiten() {

    if (
        !startZeitzone ||
        !zielZeitzone
    ) {

        return;

    }


    const jetzt =
        new Date();


    document
        .getElementById(
            "startTime"
        )
        .textContent =
        uhrzeitInZeitzone(
            jetzt,
            startZeitzone
        );


    document
        .getElementById(
            "destinationTime"
        )
        .textContent =
        uhrzeitInZeitzone(
            jetzt,
            zielZeitzone
        );

}


// =====================================================
// UHRZEIT IN ZEITZONE
// =====================================================

function uhrzeitInZeitzone(
    datum,
    zeitzone
) {

    return new Intl.DateTimeFormat(
        "de-DE",
        {
            timeZone:
                zeitzone,

            hour:
                "2-digit",

            minute:
                "2-digit",

            hourCycle:
                "h23"
        }
    ).format(datum);

}


// =====================================================
// MINUTEN SEIT MITTERNACHT
// =====================================================

function minutenSeitMitternacht(
    datum,
    zeitzone
) {

    const teile =
        new Intl.DateTimeFormat(
            "de-DE",
            {
                timeZone:
                    zeitzone,

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hourCycle:
                    "h23"
            }
        ).formatToParts(
            datum
        );


    let stunde = 0;
    let minute = 0;
    let sekunde = 0;


    for (
        const teil of teile
    ) {

        if (
            teil.type === "hour"
        ) {

            stunde =
                Number(
                    teil.value
                );

        }


        if (
            teil.type === "minute"
        ) {

            minute =
                Number(
                    teil.value
                );

        }


        if (
            teil.type === "second"
        ) {

            sekunde =
                Number(
                    teil.value
                );

        }

    }


    return (
        stunde * 60 +
        minute +
        sekunde / 60
    );

}


// =====================================================
// ZEITZONEN-OFFSET
// =====================================================

function zeitzonenOffset(
    datum,
    zeitzone
) {

    const teile =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone:
                    zeitzone,

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hourCycle:
                    "h23"
            }
        ).formatToParts(
            datum
        );


    const werte = {};


    for (
        const teil of teile
    ) {

        if (
            teil.type !==
            "literal"
        ) {

            werte[teil.type] =
                Number(
                    teil.value
                );

        }

    }


    const lokaleZeit =
        Date.UTC(
            werte.year,
            werte.month - 1,
            werte.day,
            werte.hour,
            werte.minute,
            werte.second
        );


    return (
        lokaleZeit -
        datum.getTime()
    );

}


// =====================================================
// FLUG ZURÜCKSETZEN
// =====================================================

function flugZuruecksetzen() {

    if (
        timer !== null
    ) {

        clearInterval(
            timer
        );

        timer = null;

    }


    startzeit = null;
    startZeitzone = null;
    zielZeitzone = null;

    startStadt = null;
    zielStadt = null;

    startOrtszeit = null;
    zeitverschiebung = null;
    gesamtFlugzeit = null;


    startSearch.value =
        "";

    destinationSearch.value =
        "";

    flightHours.value =
        "";

    flightMinutes.value =
        "";


    startSearch.disabled =
        false;

    destinationSearch.disabled =
        false;

    flightHours.disabled =
        false;

    flightMinutes.disabled =
        false;


    document
        .getElementById(
            "startCity"
        )
        .textContent =
        "—";


    document
        .getElementById(
            "destinationCity"
        )
        .textContent =
        "—";


    document
        .getElementById(
            "startTime"
        )
        .textContent =
        "--:--";


    document
        .getElementById(
            "destinationTime"
        )
        .textContent =
        "--:--";


    document
        .getElementById(
            "elapsed"
        )
        .textContent =
        "00:00";


    document
        .getElementById(
            "remaining"
        )
        .textContent =
        "--:--";


    document
        .getElementById(
            "arrivalCity"
        )
        .textContent =
        "—";


    document
        .getElementById(
            "arrivalDate"
        )
        .textContent =
        "—";


    document
        .getElementById(
            "arrivalTime"
        )
        .textContent =
        "--:--";


    errorMessage.textContent =
        "";


    startButton.textContent =
        "Flug starten";

    startButton.disabled =
        false;


    cancelButton.style.display =
        "none";


    uhrZuruecksetzen();

}


// =====================================================
// UHR ZURÜCKSETZEN
// =====================================================

function uhrZuruecksetzen() {

    document
        .getElementById(
            "hourHand"
        )
        .style.transform =
        "translateX(-50%) rotate(0deg)";


    document
        .getElementById(
            "minuteHand"
        )
        .style.transform =
        "translateX(-50%) rotate(0deg)";


    document
        .getElementById(
            "secondHand"
        )
        .style.transform =
        "translateX(-50%) rotate(0deg)";


    secondHand.style.display =
        "none";

}


// =====================================================
// 24-STUNDEN-MODELL
// =====================================================

function normalisiereMinuten(
    minuten
) {

    minuten =
        minuten %
        (24 * 60);


    if (
        minuten < 0
    ) {

        minuten +=
            24 * 60;

    }


    return minuten;

}


// =====================================================
// DAUER FORMATIEREN
// =====================================================

function dauerFormatieren(
    minuten
) {

    const stunden =
        Math.floor(
            minuten / 60
        );


    const rest =
        Math.floor(
            minuten % 60
        );


    return (
        zweiStellen(
            stunden
        ) +
        ":" +
        zweiStellen(
            rest
        )
    );

}


// =====================================================
// ZWEI STELLEN
// =====================================================

function zweiStellen(
    zahl
) {

    return String(
        Math.floor(
            zahl
        )
    ).padStart(
        2,
        "0"
    );

}
